<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Challenge 1</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <script>
        // Create an array containing four animals.
        var animals = ["Cat", "Fish", "Lemur", "Komodo Dragon"];

        // Start a for loop.
        // i starts at 0 because arrays start counting from 0.
        for (var i = 0; i < animals.length; i++) {

            // Get the animal at position i.
            // Add "Awesome " to the beginning of the animal.
            // Then save the new value back into the same position.
            animals[i] = "Awesome " + animals[i];
        }

        // Display the finished array in the console.
        console.log(animals);

    </script>
</body>

</html>
